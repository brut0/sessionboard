name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check repository hygiene
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          python scripts/check_repo_hygiene.py

  backend:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Ruff check & format
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run pytest (Unit & Integration via Testcontainers)
        working-directory: backend
        env:
          OTEL_SDK_DISABLED: "true"
        run: uv run pytest -v

  frontend:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check OpenAPI Drift
        working-directory: frontend
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts

      - name: TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Component tests (Vitest + RTL + MSW)
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

  ai-sdlc:
    name: AI SDLC Workbench Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "tools/ai-sdlc/uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: tools/ai-sdlc
        run: uv sync --frozen

      - name: Ruff check & pytest
        working-directory: tools/ai-sdlc
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify AI SDLC container build
        uses: docker/build-push-action@v6
        with:
          context: ./tools/ai-sdlc
          push: false
          tags: sessionboard-ai-sdlc:test

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sessionboard:test
          build-args: |
            GIT_SHA=${{ github.sha }}
